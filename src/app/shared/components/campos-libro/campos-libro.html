<div class="grid grid-cols-1 md:grid-cols-3 gap-8">

  <!-- Columna izquierda: portada grande -->
  <div class="md:col-span-1">
    <div class="md:sticky md:top-8">
      @if (datosLibro()().portadaUrl.trim()) {
        <img
          [src]="datosLibro()().portadaUrl"
          alt="Preview de portada"
          class="w-full aspect-[2/3] object-cover rounded-md shadow-md"
        />
      } @else {
        <div class="w-full aspect-[2/3] flex items-center justify-center bg-gray-100 rounded-md shadow-sm">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="w-16 h-16 text-gray-300">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25a8.987 8.987 0 0 0-3-.512c-2.305 0-4.408.867-6 2.292m0-14.25v14.25" />
          </svg>
        </div>
      }

      <div class="mt-4">
        <label class="block text-sm font-medium text-gray-600 mb-1">URL de portada</label>
        <input
          [formField]="libroForm().portadaUrl"
          class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-orange-300"
        />
      </div>
    </div>
  </div>

  <!-- Columna derecha: resto del form -->
  <div class="md:col-span-2">
    <!-- Título -->
    <div class="mb-5">
      <label class="block text-sm font-medium text-gray-600 mb-1">Título</label>
      <input
        [formField]="libroForm().titulo"
        class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-orange-300"
      />
      @if (libroForm().titulo().touched() && libroForm().titulo().errors().length) {
        <p class="text-red-600 text-xs mt-1">{{ libroForm().titulo().errors()[0].message }}</p>
      }
    </div>

    <!-- ISBN -->
    <div class="mb-5">
      <label class="block text-sm font-medium text-gray-600 mb-1">ISBN</label>
      <input
        [formField]="libroForm().isbn"
        class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-orange-300"
      />
    </div>

    <!-- Estado + Autor -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 mb-5">
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Estado</label>
        <select
          [formField]="libroForm().estado"
          class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-orange-300"
        >
          <option value="POR_LEER">Por leer</option>
          <option value="LEYENDO">Leyendo</option>
          <option value="LEIDO">Leído</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Autor</label>
        <!-- Autor no es un campo propio de este componente: en libro-form
             es un <select> por id ya persistido; en confirmar-importar
             puede ser un autor nuevo sin id todavía. Cada página resuelve
             el suyo y lo proyecta acá. -->
        <ng-content select="[campos-libro-autor]"></ng-content>
      </div>
    </div>

    <!-- Géneros -->
    <fieldset class="mt-6 border-t border-gray-100 pt-4">
      <legend class="text-xs font-semibold uppercase text-gray-400 mb-3">Géneros</legend>
      <!-- Mismo criterio que Autor: en libro-form son ids ya persistidos,
           en confirmar-importar pueden ser géneros nuevos sin id. -->
      <ng-content select="[campos-libro-generos]"></ng-content>
    </fieldset>

    <!-- Publicación y lectura -->
    <div class="mt-6 border-t border-gray-100 pt-4">
      <label class="block text-xs font-semibold uppercase text-gray-400 mb-3">
        Publicación y lectura
      </label>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 mb-5">
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Año de publicación</label>
          <input
            type="number"
            placeholder="Usa negativos para a.C., ej. -400"
            [formField]="libroForm().anioPublicacion"
            class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-orange-300"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Año de lectura (aprox.)</label>
          <input
            type="number"
            placeholder="Para libros leídos hace tiempo"
            [formField]="libroForm().anioLectura"
            class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-orange-300"
          />
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Fecha de inicio de lectura</label>
          <input
            type="date"
            [formField]="libroForm().fechaInicio"
            class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-orange-300"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Fecha de término de lectura</label>
          <input
            type="date"
            [formField]="libroForm().fechaTermino"
            class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-orange-300"
          />
        </div>
      </div>
    </div>
  </div>
  <!-- fin columna derecha -->
</div>
