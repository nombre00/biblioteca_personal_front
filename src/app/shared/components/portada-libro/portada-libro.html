<div [class]="ancho()">
  @if (portadaUrl()) {
    <img
      [src]="portadaUrl()"
      [alt]="titulo()"
      class="w-full aspect-[2/3] object-cover rounded-md shadow-md group-hover:shadow-lg transition-shadow"
    />
  } @else {
    <div class="w-full aspect-[2/3] flex items-center justify-center bg-gray-100 rounded-md shadow-sm">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        [class]="tamano() === 'grande' ? 'w-20 h-20 text-gray-300' : 'w-10 h-10 text-gray-300'"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25a8.987 8.987 0 0 0-3-.512c-2.305 0-4.408.867-6 2.292m0-14.25v14.25" />
      </svg>
    </div>
  }
</div>
