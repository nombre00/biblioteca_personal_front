<div class="w-full bg-gray-50/80 rounded-lg p-4">
  @if (titulo()) {
    <h2 [class]="tituloClase()" class="mb-4">{{ titulo() }}</h2>
  }

  <div class="relative">
    <div class="overflow-hidden">
      <div
        class="flex transition-transform duration-300 ease-out"
        [style.transform]="'translateX(-' + (paginaActual() * 100) + '%)'"
      >
        @for (pagina of paginas(); track $index) {
          <div class="flex flex-nowrap gap-x-6 shrink-0 w-full">
            @for (item of pagina; track item.id) {
              <a
                [routerLink]="['/libros', item.id]"
                class="group flex flex-col flex-1 min-w-0"
                [style.max-width.%]="100 / itemsPorPagina()"
              >
                <app-portada-libro [portadaUrl]="item.portadaUrl" [titulo]="item.titulo" tamano="chico" />
                <h3 class="mt-2 text-pequena font-medium text-gray-800 group-hover:text-orange-500 line-clamp-2">
                  {{ item.titulo }}
                </h3>
                @if (item.subtitulo) {
                  <p class="text-pequena text-gray-500 mt-0.5">{{ item.subtitulo }}</p>
                }
              </a>
            }
          </div>
        }
      </div>
    </div>

    @if (puedeAnterior()) {
      <button
        type="button"
        (click)="anterior()"
        aria-label="Anterior"
        class="absolute left-0 top-1/3 -translate-y-1/2 -translate-x-1/2 w-9 h-9 flex items-center justify-center rounded-full bg-white shadow-md border border-gray-200 text-gray-600 hover:text-orange-500 hover:border-orange-300 transition-colors"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
        </svg>
      </button>
    }

    @if (puedeSiguiente()) {
      <button
        type="button"
        (click)="siguiente()"
        aria-label="Siguiente"
        class="absolute right-0 top-1/3 -translate-y-1/2 translate-x-1/2 w-9 h-9 flex items-center justify-center rounded-full bg-white shadow-md border border-gray-200 text-gray-600 hover:text-orange-500 hover:border-orange-300 transition-colors"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
        </svg>
      </button>
    }
  </div>
</div>
