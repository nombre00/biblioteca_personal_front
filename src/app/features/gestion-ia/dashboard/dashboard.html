<div class="w-full px-6 py-8 bg-gray-100 min-h-screen">

    <!-- sección de las tabs -->
    <section class="bg-gray-50/85 rounded-md shadow-sm p-6 mb-6">
        <h1 class="text-grande font-serif font-semibold text-gray-800 mb-1">Gestión agentes IA</h1>

        <div class="flex gap-2 mb-6 border-b bg-white border-gray-200">
            <button
                type="button"
                (click)="seleccionarTab('sinopsis')"
                [class.border-b-2]="tabActiva() === 'sinopsis'"
                [class.border-amber-600]="tabActiva() === 'sinopsis'"
                [class.text-amber-700]="tabActiva() === 'sinopsis'"
                [class.font-semibold]="tabActiva() === 'sinopsis'"
                class="px-4 py-2 text-gray-600 hover:text-gray-800 transition-colors"
            >
                Sinopsis
            </button>

            <button
                type="button"
                (click)="seleccionarTab('biografia')"
                [class.border-b-2]="tabActiva() === 'biografia'"
                [class.border-amber-600]="tabActiva() === 'biografia'"
                [class.text-amber-700]="tabActiva() === 'biografia'"
                [class.font-semibold]="tabActiva() === 'biografia'"
                class="px-4 py-2 text-gray-600 hover:text-gray-800 transition-colors"
            >
                Biografías
            </button>
        </div>

        <!-- ======================= Contenido de la tab activa ======================= -->
        @switch (tabActiva()) {
            @case ('sinopsis') {
                <app-sinopsis />
            }

            @case ('biografia') {
                <app-biografias />
            }
        }
    </section>
</div>
